<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flowOS — Black & Green Cyber Edition</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Cyber Bootloader Screen -->
  <div id="boot-screen">
    <div class="boot-content">
      <div class="boot-logo">
        <svg viewBox="0 0 80 80" width="80" height="80">
          <defs>
            <linearGradient id="bootGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#00ff66"/>
              <stop offset="100%" stop-color="#059669"/>
            </linearGradient>
          </defs>
          <rect rx="22" width="80" height="80" fill="url(#bootGrad)"/>
          <text x="40" y="54" text-anchor="middle" fill="#030504" font-size="38" font-weight="700" font-family="'Plus Jakarta Sans', sans-serif">f</text>
        </svg>
      </div>
      <div class="boot-progress">
        <div class="boot-progress-bar"></div>
      </div>
    </div>
  </div>

  <!-- Main OS Desktop -->
  <div id="desktop">
    <div id="wallpaper"></div>
    <div id="desktop-icons"></div>

    <!-- Desktop Context Menu -->
    <div id="context-menu" class="hidden">
      <div class="ctx-item" data-action="new-folder">New Folder</div>
      <div class="ctx-item" data-action="change-wallpaper">Change Wallpaper</div>
      <div class="ctx-sep"></div>
      <div class="ctx-item" data-action="sort-name">Sort By Name</div>
      <div class="ctx-item" data-action="sort-date">Sort By Date</div>
      <div class="ctx-sep"></div>
      <div class="ctx-item" data-action="toggle-theme">Toggle Light/Dark Mode</div>
    </div>

    <!-- Top Menu Bar -->
    <div id="menu-bar">
      <div class="menu-left">
        <div class="menu-app-icon" id="menu-apple">
          <svg viewBox="0 0 18 18" width="16" height="16">
            <rect rx="4" width="18" height="18" fill="var(--accent)"/>
            <text x="9" y="13.5" text-anchor="middle" fill="#030504" font-size="13" font-weight="700" font-family="sans-serif">f</text>
          </svg>
        </div>
        <span class="menu-app-name" id="menu-active-app">flowOS</span>
        <div class="menu-items" id="menu-items"></div>
      </div>
      <div class="menu-right">
        <div class="menu-icon" id="btn-wifi" title="Wi-Fi">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
            <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
            <circle cx="12" cy="20" r="1"/>
          </svg>
        </div>
        <div class="menu-icon" id="btn-bluetooth" title="Bluetooth">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6.5 6.5l11 11L12 23V1l5.5 5.5-11 11"/>
          </svg>
        </div>
        <div class="menu-icon" id="btn-volume" title="Volume">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
          </svg>
        </div>
        <div class="menu-icon" id="btn-battery" title="Battery">
          <svg width="18" height="13" viewBox="0 0 28 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="1" y="2" width="22" height="12" rx="2"/>
            <rect x="3" y="4" width="16" height="8" rx="1" fill="currentColor" opacity="0.8"/>
            <path d="M25 6v4" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="menu-icon" id="btn-search" title="Spotlight Search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </div>
        <div class="menu-clock" id="menu-clock"></div>
      </div>
    </div>

    <!-- Active Windows Layer -->
    <div id="windows-container"></div>

    <!-- Dock -->
    <div id="dock-wrapper">
      <div id="dock">
        <div id="dock-apps"></div>
        <div class="dock-separator"></div>
        <div id="dock-minimized"></div>
      </div>
    </div>

    <!-- Spotlight Search Overlay -->
    <div id="spotlight-overlay" class="hidden">
      <div id="spotlight-modal">
        <div class="spotlight-input-row">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" id="spotlight-input" placeholder="Search apps, files, commands..." autocomplete="off" spellcheck="false">
        </div>
        <div id="spotlight-results"></div>
      </div>
    </div>

    <!-- Mission Control Overview -->
    <div id="mission-control" class="hidden">
      <div id="mc-windows"></div>
    </div>

    <!-- Floating Notifications -->
    <div id="notification-container"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
